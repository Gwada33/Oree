name: App — build et tests

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "*.md", "Docs/**"]
  pull_request:
    paths-ignore: ["website/**", "*.md", "Docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: Rust/adblock_bridge/target
          key: rust-${{ hashFiles('Rust/adblock_bridge/Cargo.lock') }}
      - name: Pont Rust (blocage de pubs)
        run: ./Rust/build_bridge.sh
      - name: Tests
        run: swift test
      - name: Construire l’app
        run: ./build_app.sh
