name: App — publier une version

# Pousse un tag « v1.0.0 » pour construire Oree.app et l'attacher à une release GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pont Rust (blocage de pubs)
        run: ./Rust/build_bridge.sh
      - name: Numéro de version = tag (v1.0.2 → 1.0.2)
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - name: Construire et signer (ad-hoc)
        run: ./build_app.sh
      - name: Archiver
        run: |
          ditto -c -k --keepParent Oree.app Oree-macOS-arm64.zip
          shasum -a 256 Oree-macOS-arm64.zip | tee Oree-macOS-arm64.zip.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            Oree-macOS-arm64.zip
            Oree-macOS-arm64.zip.sha256
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: Oree-macOS-arm64
          path: Oree-macOS-arm64.zip
