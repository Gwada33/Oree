name: App — publier une version

# Construit Oree.app, fabrique le zip (mise à jour intégrée) et le DMG (premier téléchargement), puis crée la release.
#  - à la main : ./scripts/release.sh patch   (pousse le tag vX.Y.Z → ce flux démarre)
#  - planifié  : scheduled-release.yml l'appelle (un tag poussé avec le jeton de GitHub ne déclenche pas d'autre flux)
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Tag à publier (ex. v1.0.3)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existant à (re)publier (ex. v1.0.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-tags: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Pont Rust (blocage de pubs)
        run: ./Rust/build_bridge.sh
      - name: Numéro de version = tag (v1.0.3 → 1.0.3)
        run: echo "${TAG#v}" > VERSION
      - name: Construire et signer (ad-hoc)
        run: ./build_app.sh
      - name: Zip (mise à jour intégrée) + empreinte
        run: |
          ditto -c -k --keepParent Oree.app Oree-macOS-arm64.zip
          shasum -a 256 Oree-macOS-arm64.zip | tee Oree-macOS-arm64.zip.sha256
      - name: Image disque (.dmg avec image de fond) + empreinte
        run: |
          pip3 install --break-system-packages dmgbuild
          ./scripts/make_dmg.sh
          mv Oree-*.dmg Oree-macOS-arm64.dmg
          shasum -a 256 Oree-macOS-arm64.dmg | tee Oree-macOS-arm64.dmg.sha256
      - name: Notes de version (le message du tag)
        run: git tag -l --format='%(contents)' "$TAG" | sed '1,2d' > notes.md; cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Orée ${{ env.TAG }}
          body_path: notes.md
          files: |
            Oree-macOS-arm64.zip
            Oree-macOS-arm64.zip.sha256
            Oree-macOS-arm64.dmg
            Oree-macOS-arm64.dmg.sha256
