[package]
name = "adblock_bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
# `single-thread` is deliberately left off: it makes `Engine` non-Send, and the
# cosmetic engine is shared across Swift threads.
adblock = { version = "0.13.3", default-features = false, features = [
    "content-blocking",
    "embedded-domain-resolver",
    "full-regex-handling",
] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.32.2", features = ["cli"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
