<!doctype html>
<html><head><meta charset="utf-8"><title>Canvas</title></head>
<body style="margin:8px;font:14px sans-serif">
<p>2D canvas, then a WebGL canvas (its pixels cannot be read back):</p>
<canvas id="c2d" width="240" height="120" style="border:2px solid #333"></canvas>
<canvas id="cgl" width="240" height="120" style="border:2px solid #333"></canvas>
<script>
var g = document.getElementById('c2d').getContext('2d');
var grad = g.createLinearGradient(0, 0, 240, 0); grad.addColorStop(0, '#f60'); grad.addColorStop(1, '#06f');
g.fillStyle = grad; g.fillRect(0, 0, 240, 120); g.fillStyle = '#fff'; g.font = '24px sans-serif'; g.fillText('CANVAS-2D', 20, 70);
var gl = document.getElementById('cgl').getContext('webgl');
gl.clearColor(1, 0, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT);
</script></body></html>
