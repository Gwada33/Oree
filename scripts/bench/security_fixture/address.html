<!doctype html><html><head><meta charset="utf-8"><title>Adresse</title></head><body>
<form onsubmit="return false">
<input id="fn" autocomplete="given-name"><input id="ln" autocomplete="family-name"><input id="em" autocomplete="email">
<input id="tel" autocomplete="tel"><input id="org" autocomplete="organization">
<input id="a1" autocomplete="address-line1"><input id="a2" autocomplete="address-line2"><input id="zip" autocomplete="postal-code">

</form></body></html>
