<!doctype html><html><head><meta charset="utf-8"><title>CMP connu</title></head><body><h1>Article</h1>
<script>window.__rejected = 0; window.__accepted = 0;
setTimeout(() => { // la bannière arrive après le chargement, comme la plupart des vraies
  document.body.insertAdjacentHTML('beforeend', '<div id="onetrust-banner-sdk" style="position:fixed;bottom:0;left:0;right:0;background:#eee;padding:20px"><p>Nous utilisons des cookies</p><button id="onetrust-accept-btn-handler">Tout accepter</button><button id="onetrust-pc-btn-handler">Personnaliser</button><button id="onetrust-reject-all-handler">Tout refuser</button></div>');
  document.getElementById('onetrust-reject-all-handler').addEventListener('click', () => window.__rejected++);
  document.getElementById('onetrust-accept-btn-handler').addEventListener('click', () => window.__accepted++);
}, 700);</script></body></html>
